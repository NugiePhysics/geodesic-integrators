[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geodesic-integrators"
dynamic = ["version"]
description = "Systematic comparison of numerical integrators (Runge-Kutta, Gauss-Legendre, Tao) for black-hole geodesics"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Nugie Saputra" }]
keywords = [
    "general relativity",
    "black hole",
    "geodesics",
    "symplectic integrators",
    "geometric numerical integration",
    "Runge-Kutta",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "numba>=0.61",
    "mpmath>=1.3",
]

[project.optional-dependencies]
# Autodiff cross-check of hand-written metric derivatives (see docs/decisions/0002).
jax = ["jax>=0.4.30"]
notebook = ["jupyterlab>=4"]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "sympy>=1.13",
    "pandas>=2.2",
    "ruff>=0.6",
    "pre-commit>=3",
    "nbmake>=1.5",
    "ipykernel>=6",
]

[project.urls]
Homepage = "https://github.com/NugiePhysics/geodesic-integrators"
Issues = "https://github.com/NugiePhysics/geodesic-integrators/issues"

[tool.hatch.version]
path = "src/geoint/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/geoint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tools/ holds the SymPy reference derivation the metric tests import; tests/ holds helpers.py.
pythonpath = ["tools", "tests"]
# Long integrations are marked `slow` and skipped by default; run them with `pytest -m slow`.
addopts = "-ra --strict-markers -m 'not slow'"
markers = ["slow: long-running integration (nightly or manual CI only)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]
# Only Python sources and notebooks are linted/formatted, not the Markdown documentation.
extend-exclude = ["docs", "report", "*.md"]

[tool.ruff.lint]
# Physics notation (M, E, L, ...) is deliberate, so the pep8-naming rules are not enabled.
select = ["E", "F", "I", "B", "UP", "SIM"]
# SIM300 would turn `x == pytest.approx(y)` into the less readable `pytest.approx(y) == x`.
ignore = ["SIM300"]
